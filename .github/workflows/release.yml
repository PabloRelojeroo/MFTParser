name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: echo "number=1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build MftParser.csproj -c Release -o publish -p:Version=${{ steps.version.outputs.number }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.number }}
          name: MFT Parser v${{ steps.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: publish/MftParser.exe
